<svg xmlns="http://www.w3.org/2000/svg" width="540" height="240" viewBox="0 0 540 240" role="img" aria-labelledby="ag-title ag-desc">
  <title id="ag-title">Agendify — WhatsApp Appointment Management SaaS</title>
  <desc id="ag-desc">Project card for Agendify showing stack, architecture focus, and live product status.</desc>
  <defs>
    <linearGradient id="ag-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ag-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="540" height="240" rx="14" fill="url(#ag-bg)"/>
  <rect x="0.5" y="0.5" width="539" height="239" rx="13.5" fill="none" stroke="#1E293B" stroke-width="1"/>
  <rect x="24" y="0" width="120" height="3" rx="1.5" fill="url(#ag-top)"/>

  <!-- Header -->
  <text x="28" y="44" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">Agendify</text>
  <rect x="424" y="24" width="88" height="24" rx="12" fill="#0C4A6E" fill-opacity="0.45" stroke="#0EA5E9" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="438" cy="36" r="3.5" fill="#38BDF8"/>
  <text x="448" y="40" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">SAAS · LIVE</text>

  <text x="28" y="68" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">WhatsApp Appointment Management Platform</text>

  <!-- Description -->
  <text x="28" y="100" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5">Multi-tenant scheduling SaaS built around WhatsApp</text>
  <text x="28" y="120" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5">conversations, with admin dashboard &amp; client portal.</text>

  <!-- Focus -->
  <text x="28" y="152" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">FOCUS: Tenant isolation · Automated reminders · Modular API</text>

  <!-- Stack pills -->
  <g transform="translate(28 178)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500">
    <rect x="0" y="0" width="86" height="26" rx="6" fill="#1E293B"/>
    <text x="12" y="17" fill="#E2E8F0">TypeScript</text>

    <rect x="94" y="0" width="72" height="26" rx="6" fill="#1E293B"/>
    <text x="108" y="17" fill="#E2E8F0">Fastify</text>

    <rect x="174" y="0" width="90" height="26" rx="6" fill="#1E293B"/>
    <text x="185" y="17" fill="#E2E8F0">PostgreSQL</text>

    <rect x="272" y="0" width="66" height="26" rx="6" fill="#1E293B"/>
    <text x="285" y="17" fill="#E2E8F0">Prisma</text>

    <rect x="346" y="0" width="68" height="26" rx="6" fill="#1E293B"/>
    <text x="358" y="17" fill="#E2E8F0">Vitest</text>
  </g>
</svg>
