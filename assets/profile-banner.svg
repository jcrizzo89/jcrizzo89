<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Juan Cruz Rizzo — Quality Engineering &amp; Software Engineering</title>
  <desc id="banner-desc">Editorial technical banner for Juan Cruz Rizzo featuring dark slate surfaces, precision grid lines, and geometric signal motifs.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="60%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="accent-diag" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow-right" cx="82%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glow-right)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Right-side geometric architecture / signal motif -->
  <g fill="none" stroke="url(#accent-diag)" stroke-width="2" opacity="0.75">
    <path d="M 820 360 L 1010 40 L 1200 40"/>
    <path d="M 900 360 L 1090 40"/>
    <path d="M 980 360 L 1170 40"/>
    <path d="M 800 290 L 1120 290 L 1200 210"/>
    <path d="M 930 360 L 930 245 L 1045 130 L 1200 130"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-opacity="0.2" stroke-width="1">
    <path d="M 780 0 V 360 M 880 0 V 360 M 980 0 V 360 M 1080 0 V 360"/>
    <path d="M 760 90 H 1200 M 760 180 H 1200 M 760 270 H 1200"/>
  </g>
  <g transform="translate(935 88)" fill="none" stroke="url(#accent-diag)" stroke-width="11" stroke-linejoin="bevel" opacity="0.92">
    <path d="M 16 172 L 106 14 L 196 172 L 286 14"/>
  </g>
  <circle cx="935" cy="88" r="4.5" fill="#38BDF8"/>
  <circle cx="1131" cy="260" r="4.5" fill="#A855F7"/>

  <!-- Top status pill -->
  <g transform="translate(64 52)">
    <rect width="276" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" fill="#10B981"/>
    <text x="32" y="18.5" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.06em">QUALITY &amp; AI SYSTEMS · ISTQB</text>
  </g>

  <!-- Main Typography -->
  <text x="64" y="148" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">Juan Cruz Rizzo</text>
  <text x="64" y="192" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.01em">Quality Engineer  ·  AI Quality  ·  Software Engineer</text>

  <!-- Value proposition -->
  <text x="64" y="238" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Building reliable software through end-to-end quality strategy, test automation,</text>
  <text x="64" y="260" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">performance &amp; resilience engineering, and thoughtful product development.</text>

  <!-- Bottom accent bar & metadata -->
  <line x1="64" y1="302" x2="720" y2="302" stroke="url(#accent-line)" stroke-width="2" opacity="0.85"/>
  <text x="64" y="328" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="0.04em">TELECOM ARGENTINA  ·  CO-FOUNDER @ RZZ LABS  ·  CREATOR @ AGENDIFY</text>
</svg>